# herdr configuration — overrides only. Run `herdr config --defaults` (or read
# the docs) for the full annotated default set.

onboarding = false

[theme]
# "terminal" follows the host terminal ANSI palette (lackluster via ghostty)
name = "terminal"
auto_switch = false

# lackluster palette; the terminal defaults are near-invisible on #080808
[theme.custom]
panel_bg = "#080808"
accent = "#789978"
surface_dim = "#141414"
surface0 = "#1f1f1f"
surface1 = "#3a3a3a"
overlay0 = "#585858"
overlay1 = "#708090"
text = "#deeeed"
subtext0 = "#708090"
red = "#d70000"
green = "#789978"
yellow = "#ffaa88"
blue = "#7788aa"
mauve = "#789978"
teal = "#708090"
peach = "#ffaa88"

[keys]
previous_workspace = "ctrl+alt+k"
next_workspace = "ctrl+alt+j"
switch_workspace = "prefix+shift+1..9"

[keys.indexed]
workspaces = "ctrl+alt" # ctrl+alt+1..9 jumps straight to that space (no prefix)

# vim-herdr-navigation: <C-h/j/k/l> across vim splits and herdr panes
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# overrides the default rename_pane binding
[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus projects picker"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus quick actions picker"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "jt.command-palette.open"
description = "Command palette"

# shepherd board — add/edit/toggle/priority/category all happen inside the panel.
# .open uses the placement from shepherd's config.toml; the rest force one.
[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "jwarykowski.herdr-shepherd.open"
description = "shepherd"

[[keys.command]]
key = "prefix+shift+t"
type = "plugin_action"
command = "jwarykowski.herdr-shepherd.open-tab"
description = "shepherd (tab)"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "jwarykowski.herdr-shepherd.open-overlay"
description = "shepherd (overlay)"

[[keys.command]]
key = "prefix+shift+z"
type = "plugin_action"
command = "jwarykowski.herdr-shepherd.open-zoomed"
description = "shepherd (zoomed)"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-lazy.manage"
description = "manage plugins"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "spotify-now-playing.open"
description = "spotify now playing"

[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"
description = "run lazygit"

[[keys.command]]
key = "prefix+alt+s"
type = "pane"
command = "spotify_player"
description = "run spotify_player"

[ui]
sidebar_width = 104
sidebar_max_width = 128
pane_gaps = true
hide_tab_bar_when_single_tab = true
show_agent_labels_on_pane_borders = false
agent_panel_sort = "priority"

[ui.toast]
delivery = "herdr"

[experimental]
pane_history = false
