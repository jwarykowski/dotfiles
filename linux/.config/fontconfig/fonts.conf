<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- apps asking for "monospace" (gtk, browsers, editors) get berkeley mono -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Berkeley Mono</family>
    </prefer>
  </alias>
</fontconfig>
