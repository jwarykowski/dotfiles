name: lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck ships on ubuntu runners
      - run: shellcheck install.sh scripts/*.sh scripts/immich/*.sh linux/.local/bin/* mac/.local/bin/*

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stylua
        # a plain download: the action looks releases up on the forge's API
        run: |
          curl -fsSL -o /tmp/stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/latest/download/stylua-linux-x86_64.zip
          unzip -q /tmp/stylua.zip -d /tmp
          /tmp/stylua --check common/.config/nvim/lua
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - name: luacheck
        # the luacheck action's container mangles its args under act
        run: |
          luarocks install luacheck
          luacheck --config common/.config/nvim/.luacheckrc common/.config/nvim/lua
