name: lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck ships on ubuntu runners
      - run: shellcheck install.sh scripts/*.sh scripts/immich/*.sh linux/.local/bin/* mac/.local/bin/*

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check common/.config/nvim/lua
      - uses: lunarmodules/luacheck@v1
        with:
          args: --config common/.config/nvim/.luacheckrc common/.config/nvim/lua
