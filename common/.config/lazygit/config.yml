notARepository: quit
promptToReturnFromSubprocess: false
gui:
  border: 'single'
  commandLogSize: 1
  mouseEvents: false
  showBottomLine: false
  showBranchCommitHash: true
  showFileTree: false
  showRandomTip: false
  showDivergenceFromBaseBranch: arrowAndNumber
  filterMode: fuzzy
  commitLength:
    show: true
  sidePanelWidth: 0.3
  expandFocusedSidePanel: true
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --features=lazygit
  autoFetch: true
  autoRefresh: true
  fetchAll: true
  mainBranches: [master, main]
  overrideGpg: true
  log:
    showGraph: always
os:
  editPreset: nvim
customCommands:
  - key: C
    description: "Conventional commit"
    context: files
    prompts:
      - type: menu
        title: "Commit type"
        key: Type
        options:
          - name: feat
            description: "new feature"
            value: feat
          - name: fix
            description: "bug fix"
            value: fix
          - name: chore
            description: "chores / maintenance"
            value: chore
          - name: refactor
            description: "refactoring"
            value: refactor
          - name: docs
            description: "documentation"
            value: docs
          - name: test
            description: "tests"
            value: test
          - name: style
            description: "formatting / style"
            value: style
          - name: perf
            description: "performance"
            value: perf
      - type: input
        title: "Scope (optional)"
        key: Scope
        initialValue: ""
      - type: input
        title: "Message"
        key: Message
    command: >-
      git commit -m {{.Form.Type}}{{if .Form.Scope}}"("{{.Form.Scope | quote}}")"{{end}}": "{{.Form.Message | quote}}
    loadingText: committing...
