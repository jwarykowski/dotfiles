# btop — overrides only, everything else is btop's default.
# `btop --default-config` prints the full annotated set.
# Note: btop rewrites this file in full on exit, so it re-expands itself.

color_theme = "lackluster"

shown_boxes = "mem cpu net proc"
clock_format = "%H:%M"
vim_keys = true

cpu_graph_upper = "total"
cpu_graph_lower = "total"

proc_sorting = "cpu direct"
proc_per_core = true

use_fstab = false
